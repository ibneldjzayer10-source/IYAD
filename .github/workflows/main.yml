name: BMW Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: فك الضغط وتجهيز الأدوات
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg unzip
          if [ -f "bmw-empire.zip" ]; then unzip -o bmw-empire.zip; fi
      - name: تثبيت المكتبات وتشغيل المصنع
        run: |
          REQ_FILE=$(find . -name "requirements.txt" | head -n 1)
          DIR=$(dirname "$REQ_FILE")
          cd "$DIR"
          pip install -r requirements.txt
          python run_pipeline.py
