name: BMW Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: إنتاج ونشر ريلز BMW بفيديو حقيقي
        env:
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
        run: |
          pip install -q edge-tts requests imageio-ffmpeg
          python3 -c '
          import os, random, asyncio, edge_tts, subprocess, requests, imageio_ffmpeg

          FFMPEG = imageio_ffmpeg.get_ffmpeg_exe()
          KEY = os.environ["ZERNIO_KEY"]
          API = "https://zernio.com" + "/api/v1"
          H = {"Authorization": f"Bearer {KEY}"}
          UA = {"User-Agent": "BMWReelsBot/1.0 (contact@example.com)"}

          TOPICS = [
              {
                  "script": "هل تعلم أن محرك بي إم دبليو إم فايف إي سيكستي من نوع في تن بسعة خمسة لترات، هو المحرك الوحيد في تاريخ سيارات السيدان المستوحى مباشرة من سيارات الفورمولا وان؟ يولد خمسمئة وسبعة أحصنة بصوت يطرب عشاق السرعة!",
                  "caption": "هل تعتبر محرك V10 في M5 E60 أعظم صوت محرك صنعته BMW؟ 🔥 شاركنا رأيك! #BMW #BMWM5 #V10 #عشاق_السيارات"
              },
              {
                  "script": "تخفيف الوزن بمقدار مئة كيلوغرام كاملة مع محرك إس فيفتي إيت توين تيربو بقوة خمسمئة وخمسين حصاناً! هكذا صنعت بي إم دبليو نسخة إم فور سي إس إل الأسطورية لتسجل أسرع لفة لسيارة إنتاجية على حلبة نوربورغرينغ!",
                  "caption": "550 حصان ووزن أخف بـ 100 كجم! هل تتفوق M4 CSL على منافسيها؟ 🏁 #BMWM4 #MPower #سيارات_رياضية"
              },
              {
                  "script": "في عام ألف وتسعمئة وستة وثمانين، صنعت بي إم دبليو سيارة إم ثري إي ثيرتي خصيصاً لتهيمن على سباقات دي تي إم العالمية! محرك رباعي الأسطوانات خفيف الوزن وتوزيع مثالي جعلها أيقونة لا تتكرر!",
                  "caption": "من هنا بدأت أسطورة M3 في عام 1986 👑 أي جيل من M3 هو المفضل لديك؟ #BMWM3 #E30 #تاريخ_السيارات"
              }
          ]

          item = random.choice(TOPICS)

          async def make_audio():
              await edge_tts.Communicate(item["script"], "ar-SA-HamedNeural", rate="+5%").save("voice.mp3")
          asyncio.run(make_audio())

          search_url = "https://wikimedia.org"
          res = requests.get(search_url, headers=UA, timeout=30).json()
          pages = list(res.get("query", {}).get("pages", {}).values())
          vid_urls = [next(iter(p["imageinfo"]))["url"] for p in pages if p.get("imageinfo")]
          chosen_url = random.choice(vid_urls)
          print("🎥 جاري تحميل الفيديو الحقيقي:", chosen_url)

          with requests.get(chosen_url, headers=UA, stream=True, timeout=60) as r:
              r.raise_for_status()
              with open("raw_car.vid", "wb") as f:
                  for chunk in r.iter_content(chunk_size=8192):
                      f.write(chunk)

          subprocess.run([
              FFMPEG, "-y", "-stream_loop", "-1", "-i", "raw_car.vid", "-i", "voice.mp3",
              "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=25",
              "-map", "0:v:0", "-map", "1:a:0",
              "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-shortest", "reel.mp4"
          ], check=True)

          r_acc = requests.get(API + "/accounts", headers=H).json()
          accs = r_acc.get("accounts", r_acc) if isinstance(r_acc, dict) else r_acc
          ig_id = next(a.get("_id") or a.get("id") for a in accs if a.get("platform") == "instagram")

          with open("reel.mp4", "rb") as f:
              up = requests.post(API + "/media", headers=H, files={"files": ("reel.mp4", f, "video/mp4")}).json()
          flist = up.get("files") or up.get("media") or [up]
          vid_url = next(iter(flist))["url"]

          post = requests.post(API + "/posts", headers=H, json={
              "content": item["caption"],
              "mediaItems": [{"type": "video", "url": vid_url}],
              "platforms": [{"platform": "instagram", "accountId": ig_id, "platformSpecificData": {"contentType": "reels"}}],
              "publishNow": True
          })
          print("✅ تم نشر الريلز الحقيقي بنجاح:", post.status_code)
          '
