name: BMW Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # النشر يومياً الساعة 7 مساءً بتوقيت الجزائر

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: صناعة ريلز احترافي بمونتاج سريع وترجمة عربية سليمة
        env:
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
        run: |
          pip install -q edge-tts requests imageio-ffmpeg Pillow arabic-reshaper python-bidi gdown
          python3 -c '
          import os, glob, random, asyncio, edge_tts, subprocess, requests, imageio_ffmpeg, gdown
          import arabic_reshaper
          from bidi.algorithm import get_display
          from PIL import Image, ImageDraw, ImageFont

          FFMPEG = imageio_ffmpeg.get_ffmpeg_exe()
          KEY = os.environ["ZERNIO_KEY"]
          API = "https://zernio.com" + "/api/v1"
          H = {"Authorization": f"Bearer {KEY}"}
          FOLDER_ID = "1KpnN7wch32bfzp5biG3tBJ5PMawWPxTQ"

          TOPICS = [
              {
                  "script": "توقف واسمع هذا الوحش! محرك بي إم دبليو إم فايف من نوع في تن بسعة خمسة لترات، مستوحى مباشرة من سيارات الفورمولا وان بقوة خمسمئة وسبعة أحصنة! برأيك هل هو أعظم صوت محرك في التاريخ أم تفضل التيربو الحديث؟",
                  "caption": "اسمع طرب الـ V10 🔥 برأيك هل M5 E60 أعظم من M5 F90؟ اكتب رأيك في التعليقات! 👇 #BMW #BMWM5 #V10 #عشاق_السيارات"
              },
              {
                  "script": "مستحيل أن تصدق هذا الرقم! محرك إس فيفتي إيت توين تيربو من بي إم دبليو يتحمل تعديلات تصل لأكثر من ألف حصان دون تغيير القطع الداخلية! وحش هندسي مرعب يسيطر على الشوارع والحلبات!",
                  "caption": "1000 حصان من محرك S58 بدون تعديل داخلي! 🤯 أي وحش من BMW تختار؟ #S58 #BMWM3 #BMWM4 #تعديل_سيارات"
              },
              {
                  "script": "لماذا يعشق المحترفون قيادة بي إم دبليو أكثر من أي سيارة أخرى؟ السر هو التوزيع المثالي للوزن خمسين بالمئة في الأمام وخمسين بالمئة في الخلف! توازن هندسي يجعلك ملك المنعطفات بلا منازع!",
                  "caption": "توزيع وزن 50/50 هو سر متعة القيادة الحقيقية 👑 منشن صديقك عاشق BMW! #BMW #MPower #هندسة_السيارات"
              },
              {
                  "script": "عندما تجتمع الفخامة الألمانية مع وحشية حلبات السباق! سيارات بي إم دبليو إم باور لا تمنحك مجرد سرعة على الخط المستقيم، بل تعطيك تحكماً أسطورياً في كل منعطف!",
                  "caption": "هندسة صُممت لعشاق القيادة الحقيقية 🏁 أي طراز من BMW تحلم بامتلاكه؟ #BMW #BMWM #سيارات_رياضية"
              }
          ]

          item = random.choice(TOPICS)

          # 1. تحميل الفيديوهات من مجلد Google Drive الخاص بك
          os.makedirs("gdrive_vids", exist_ok=True)
          gdown.download_folder(id=FOLDER_ID, output="gdrive_vids", quiet=True, use_cookies=False)

          all_vids = []
          for ext in ("*.mp4", "*.mov", "*.MP4", "*.MOV"):
              all_vids.extend(glob.glob(f"gdrive_vids/**/{ext}", recursive=True))

          if not all_vids:
              raise SystemExit("❌ لم يتم العثور على فيديوهات في المجلد!")

          selected = random.sample(all_vids, min(3, len(all_vids)))
          clip_files = []
          for idx, vpath in enumerate(selected):
              norm_name = f"norm_{idx}.mp4"
              subprocess.run([
                  FFMPEG, "-y", "-i", vpath, "-t", "4.5",
                  "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setsar=1",
                  "-an", "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p", norm_name
              ], check=True)
              clip_files.append(norm_name)

          with open("list.txt", "w") as f:
              for _ in range(3):
                  for c in clip_files:
                      f.write(f"file \x27{c}\x27\n")

          subprocess.run([FFMPEG, "-y", "-f", "concat", "-safe", "0", "-i", "list.txt", "-c", "copy", "base_vid.mp4"], check=True)

          # 2. توليد الصوت واستخراج توقيت الكلمات
          async def generate_voice():
              communicate = edge_tts.Communicate(item["script"], "ar-SA-HamedNeural", rate="+10%")
              audio_data = bytearray()
              words = []
              async for chunk in communicate.stream():
                  if chunk["type"] == "audio":
                      audio_data.extend(chunk["data"])
                  elif chunk["type"] == "WordBoundary":
                      st = chunk["offset"] / 10_000_000
                      dur = chunk["duration"] / 10_000_000
                      words.append({"text": chunk["text"], "start": st, "end": st + dur})
              with open("voice.mp3", "wb") as f:
                  f.write(audio_data)
              return words

          words = asyncio.run(generate_voice())

          captions = []
          for i in range(0, len(words), 3):
              group = words[i:i+3]
              phrase = " ".join(w["text"] for w in group)
              st = next(iter(group))["start"]
              en = group[-1]["end"] + 0.15
              captions.append((phrase, st, en))

          # 3. رسم الترجمة العربية السليمة
          font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 62)
          sub_files = []
          for idx, (phrase, st, en) in enumerate(captions):
              img = Image.new("RGBA", (1080, 1920), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              bidi_text = get_display(arabic_reshaper.reshape(phrase))
              b = draw.textbbox((540, 1360), bidi_text, font=font, anchor="mm")
              x0, y0, x1, y1 = b
              draw.rounded_rectangle((x0 - 24, y0 - 20, x1 + 24, y1 + 20), radius=20, fill=(0, 15, 35, 215))
              draw.text((540, 1360), bidi_text, font=font, fill=(255, 255, 255, 255), anchor="mm", stroke_width=3, stroke_fill=(0, 0, 0, 255))
              fname = f"sub_{idx}.png"
              img.save(fname)
              sub_files.append((fname, st, en))

          inputs = ["-y", "-i", "base_vid.mp4", "-i", "voice.mp3"]
          for fname, _, _ in sub_files:
              inputs.extend(["-i", fname])

          filter_parts = []
          last_v = "0:v"
          for idx, (_, st, en) in enumerate(sub_files):
              inp_idx = idx + 2
              next_v = f"v{idx+1}"
              filter_parts.append(f"[{last_v}][{inp_idx}:v]overlay=0:0:enable=\x27between(t,{st:.2f},{en:.2f})\x27[{next_v}]")
              last_v = next_v

          subprocess.run([
              FFMPEG] + inputs + [
              "-filter_complex", ";".join(filter_parts),
              "-map", f"[{last_v}]", "-map", "1:a",
              "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-shortest", "reel.mp4"
          ], check=True)

          # 4. النشر عبر Zernio
          r_acc = requests.get(API + "/accounts", headers=H).json()
          accs = r_acc.get("accounts", r_acc) if isinstance(r_acc, dict) else r_acc
          ig_id = next(a.get("_id") or a.get("id") for a in accs if a.get("platform") == "instagram")

          with open("reel.mp4", "rb") as f:
              up = requests.post(API + "/media", headers=H, files={"files": ("reel.mp4", f, "video/mp4")}).json()
          flist = up.get("files") or up.get("media") or [up]
          vid_url = next(iter(flist))["url"]

          post = requests.post(API + "/posts", headers=H, json={
              "content": item["caption"],
              "mediaItems": [{"type": "video", "url": vid_url}],
              "platforms": [{"platform": "instagram", "accountId": ig_id, "platformSpecificData": {"contentType": "reels"}}],
              "publishNow": True
          })
          print("✅ تم نشر الريلز الاحترافي بمونتاج سريع بنجاح:", post.status_code)
          '
