name: BMW Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: تشغيل ونشر فيديو BMW مباشرة
        run: |
          pip install -q edge-tts requests imageio-ffmpeg
          python3 -c '
          import asyncio, edge_tts, subprocess, requests, imageio_ffmpeg

          FFMPEG = imageio_ffmpeg.get_ffmpeg_exe()
          KEY = "6b0027adc7bae6f58e00c7be"
          H = {"Authorization": f"Bearer {KEY}"}
          TEXT = "هل تعلم أن محرك بي إم دبليو M5 E60 من نوع V10 بسعة خمسة لترات مستوحى مباشرة من سيارات الفورمولا وان؟ بقوة 507 حصان وصوت يطرب عشاق السرعة!"

          async def make_audio():
              await edge_tts.Communicate(TEXT, "ar-SA-HamedNeural").save("voice.mp3")

          asyncio.run(make_audio())

          subprocess.run([
              FFMPEG, "-y", "-f", "lavfi", "-i", "color=c=0x003366:s=1080x1920:d=15:r=25",
              "-i", "voice.mp3", "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-shortest", "reel.mp4"
          ], check=True)

          acc_res = requests.get("https://zernio.com", headers=H).json()
          accs = acc_res.get("accounts", acc_res) if isinstance(acc_res, dict) else acc_res
          ig_id = next(a.get("_id") or a.get("id") for a in accs if a.get("platform") == "instagram")

          with open("reel.mp4", "rb") as f:
              up = requests.post("https://zernio.com", headers=H, files={"files": ("reel.mp4", f, "video/mp4")}).json()
          vid_url = (up.get("files") or up.get("media") or [up])[0]["url"]

          post = requests.post("https://zernio.com", headers=H, json={
              "content": "أسطورة محركات BMW V10 🔥 أي جيل من M5 تفضل؟ #BMW #BMWM5 #سيارات",
              "mediaItems": [{"type": "video", "url": vid_url}],
              "platforms": [{"platform": "instagram", "accountId": ig_id, "platformSpecificData": {"contentType": "reels"}}],
              "publishNow": True
          })
          print("النتيجة:", post.status_code, post.text)
          '
