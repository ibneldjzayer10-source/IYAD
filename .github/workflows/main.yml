name: BMW Auto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 1. سحب الملفات والصور
        uses: actions/checkout@v4

      - name: 2. صناعة الريلز من صورك ونشرها
        env:
          ZERNIO_KEY: ${{ secrets.ZERNIO_KEY }}
        run: |
          ls -la
          pip install -q edge-tts requests imageio-ffmpeg Pillow
          python3 -c '
          import os, random, asyncio, edge_tts, subprocess, requests, imageio_ffmpeg
          from PIL import Image, ImageOps, ImageFilter

          FFMPEG = imageio_ffmpeg.get_ffmpeg_exe()
          KEY = os.environ["ZERNIO_KEY"]
          API = "https://zernio.com" + "/api/v1"
          H = {"Authorization": f"Bearer {KEY}"}

          TOPICS = [
              {
                  "script": "هل تعلم أن محرك بي إم دبليو إم فايف من نوع في تن بسعة خمسة لترات، مستوحى مباشرة من سيارات الفورمولا وان؟ قوة جبارة وصوت يطرب عشاق السرعة في كل مكان!",
                  "caption": "الأسطورة لا تقبل المساومة 🔥 ما رأيك في وحش BMW M5؟ #BMW #BMWM5 #MPower #سيارات"
              },
              {
                  "script": "هندسة هجومية وانسيابية مصممة خصيصاً للسيطرة على الحلبات! سيارات بي إم دبليو إم فور تجمع بين الوزن الخفيف والقوة الخارقة لتمنحك تجربة قيادة لا مثيل لها!",
                  "caption": "مُصممة للهيمنة على الطريق والحلبات 🏁 أي جيل من BMW M4 تفضل؟ #BMWM4 #M4CS #عشاق_السيارات"
              },
              {
                  "script": "منذ انطلاق الفئة الثالثة من بي إم دبليو، وضعت معياراً جديداً للتوازن بين الفخامة والأداء الرياضي اليومي! سيارة تعشق المنعطفات وتمنحك متعة القيادة الحقيقية!",
                  "caption": "متعة القيادة الحقيقية تبدأ من هنا 👑 شاركنا رأيك في الفئة الثالثة! #BMW #BMW3Series #F30"
              }
          ]

          item = random.choice(TOPICS)

          async def make_audio():
              await edge_tts.Communicate(item["script"], "ar-SA-HamedNeural", rate="+5%").save("voice.mp3")
          asyncio.run(make_audio())

          # فحص كل الملفات الموجودة واختيار أي ملف يمكن فتحه كصورة (بغض النظر عن الامتداد)
          imgs = []
          for root, dirs, files in os.walk("."):
              if ".git" in root or ".github" in root:
                  continue
              for f in files:
                  if f in ("frame.jpg", "bg.png"):
                      continue
                  p = os.path.join(root, f)
                  try:
                      with Image.open(p) as im:
                          im.verify()
                      imgs.append(p)
                  except Exception:
                      pass

          print("📂 الصور المكتشفة:", imgs)
          if not imgs:
              raise SystemExit("❌ المستودع لا يحتوي على أي ملف صورة! تأكد أنك في المستودع الصحيح.")

          chosen_img = random.choice(imgs)
          print("🖼️ جاري استخدام صورتك:", chosen_img)

          orig = Image.open(chosen_img).convert("RGB")
          bg = ImageOps.fit(orig, (1080, 1920), method=Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(25))
          fg = ImageOps.contain(orig, (1080, 1450), method=Image.Resampling.LANCZOS)
          bg.paste(fg, ((1080 - fg.width) // 2, (1920 - fg.height) // 2))
          bg.save("frame.jpg", quality=95)

          subprocess.run([
              FFMPEG, "-y", "-loop", "1", "-i", "frame.jpg", "-i", "voice.mp3",
              "-vf", "scale=1200:2133,zoompan=z=\x27min(zoom+0.0007,1.12)\x27:d=1200:s=1080x1920:fps=25",
              "-c:v", "libx264", "-preset", "fast", "-pix_fmt", "yuv420p",
              "-c:a", "aac", "-shortest", "reel.mp4"
          ], check=True)

          r_acc = requests.get(API + "/accounts", headers=H).json()
          accs = r_acc.get("accounts", r_acc) if isinstance(r_acc, dict) else r_acc
          ig_id = next(a.get("_id") or a.get("id") for a in accs if a.get("platform") == "instagram")

          with open("reel.mp4", "rb") as f:
              up = requests.post(API + "/media", headers=H, files={"files": ("reel.mp4", f, "video/mp4")}).json()
          flist = up.get("files") or up.get("media") or [up]
          vid_url = next(iter(flist))["url"]

          post = requests.post(API + "/posts", headers=H, json={
              "content": item["caption"],
              "mediaItems": [{"type": "video", "url": vid_url}],
              "platforms": [{"platform": "instagram", "accountId": ig_id, "platformSpecificData": {"contentType": "reels"}}],
              "publishNow": True
          })
          print("✅ تم نشر الريلز بصورتك بنجاح:", post.status_code)
          '
